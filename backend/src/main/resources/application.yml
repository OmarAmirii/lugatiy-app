spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB}}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 505MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
app:
  storage-path: ${STORAGE_PATH:./uploads}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
